# New Linux self-host installs. Save this file as compose.yml.
# Existing bridge deployments can keep compose.yaml without migrating.
name: kindred
services:
  server:
    image: ghcr.io/awpsec/kindred-server:${KINDRED_VERSION:-latest}
    platform: linux/amd64
    network_mode: host
    # Older images without this entrypoint stop instead of exposing all interfaces.
    entrypoint: [python3, /opt/kindred/source/deploy/linux-host-entry.py]
    restart: unless-stopped
    init: true
    environment:
      KINDRED_NETWORK_MODE: host
      KINDRED_ACCESS: "${KINDRED_ACCESS:-local}"
      KINDRED_TAILNET_ADDRESS: "${KINDRED_TAILNET_ADDRESS:-}"
      KINDRED_PUBLIC_URL: "${KINDRED_PUBLIC_URL:-http://127.0.0.1:9444}"
      KINDRED_ALLOWED_ORIGINS: '${KINDRED_ALLOWED_ORIGINS:-[]}'
      KINDRED_OPEN_REGISTRATION: "${KINDRED_OPEN_REGISTRATION:-true}"
      # Resources for each profile's VM, shared by all bots in that profile.
      KINDRED_VM_CPUS: "${KINDRED_VM_CPUS:-2}"
      KINDRED_VM_MEMORY_MB: "${KINDRED_VM_MEMORY_MB:-6144}"
      KINDRED_VM_DISK_GB: "${KINDRED_VM_DISK_GB:-30}"
      KINDRED_VM_ACCEL: "${KINDRED_VM_ACCEL:-auto}"
    volumes:
      - kindred-data:/data
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 90s
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9444/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6
volumes:
  kindred-data:
